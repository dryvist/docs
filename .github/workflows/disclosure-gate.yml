---
# Disclosure Gate — thin wrapper over the central reusable workflow
#
# Delegates the gitleaks and disclosure-denylist checks to
# `JacobPEvans/.github/.github/workflows/_disclosure-gate.yml@b6c7d9be8f93af36e215831b2d28a60e13ab2227 # v1.23.3`.

name: Disclosure Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  disclosure-gate:
    permissions:
      contents: read
      pull-requests: read
    uses: JacobPEvans/.github/.github/workflows/_disclosure-gate.yml@5ad431c84dabc4d7faebf23a54630bf6efb3cd5b # v1.31.0
    secrets:
      GITLEAKS_PRIVATE_CONFIG: ${{ secrets.GITLEAKS_PRIVATE_CONFIG }}
      GITLEAKS_LICENSE_KEY: ${{ secrets.GITLEAKS_LICENSE_KEY }}
      DISCLOSURE_DENYLIST: ${{ secrets.DISCLOSURE_DENYLIST }}
