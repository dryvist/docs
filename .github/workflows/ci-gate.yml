# CI Gate — thin wrapper over the central reusable workflow
#
# Delegates the standard checks to the central orchestrator
# `JacobPEvans/.github/.github/workflows/_ci-gate.yml@b6c7d9be8f93af36e215831b2d28a60e13ab2227 # v1.23.3`; its `Merge Gate`
# summary job always reports, making it safe to require in rulesets.

name: CI Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Job id `gate` is the org-canonical caller shape: the required status
  # check context is `gate / Merge Gate` on every consumer.
  gate:
    permissions:
      contents: read
      pull-requests: read
      # The org gate's queue watchdog cancels stuck sibling jobs via the
      # Actions API; a called workflow can never exceed the caller's grant,
      # so `actions: write` must be granted here or the run fails at graph
      # validation (startup_failure).
      actions: write
    uses: JacobPEvans/.github/.github/workflows/_ci-gate.yml@db08209e804a3de6760b2fc8318fabf26d81857d # v1.47.2
    with:
      osv_scan: true
      markdown_lint: false
